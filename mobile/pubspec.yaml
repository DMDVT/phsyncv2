name: photosync
description: Privacy-first local photo and video gallery with optional social sharing.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.10.0
  flutter_secure_storage: ^9.2.4
  photo_manager: ^3.10.0
  photo_view: ^0.15.0
  video_player: ^2.13.0
  permission_handler: ^11.4.0
  path_provider: ^2.1.6
  flutter_image_compress: ^2.5.0
  file_picker: 10.3.10
  share_plus: ^10.1.4
  local_auth: ^2.3.0
  google_mlkit_face_detection: ^0.14.0
  shared_preferences: ^2.5.5
  image: ^4.5.4
  intl: ^0.20.3
  uuid: ^4.6.0
  path: ^1.9.1
  crypto: ^3.0.7
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
