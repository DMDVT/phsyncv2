services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - .:/app
      - temp_media:/app/temp_shares
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    env_file: .env
    volumes:
      - .:/app
      - temp_media:/app/temp_shares
    depends_on: [db, redis]
    command: celery -A workers.celery_app.celery worker --loglevel=INFO

  beat:
    build: .
    env_file: .env
    volumes:
      - .:/app
      - temp_media:/app/temp_shares
    depends_on: [db, redis]
    command: celery -A workers.celery_app.celery beat --loglevel=INFO

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: photosync
      POSTGRES_PASSWORD: photosync
      POSTGRES_DB: photosync
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photosync"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
  temp_media:
