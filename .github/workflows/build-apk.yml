name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build PhotoSync APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Show Flutter version
        run: flutter --version

      - name: Check mobile project
        run: |
          test -f mobile/pubspec.yaml
          ls -la mobile

      - name: Generate Android platform
        working-directory: mobile
        run: |
          flutter create . --platforms=android

          python3 - <<'PY'
          from pathlib import Path

          gradle_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          changed = False

          for gradle_file in gradle_files:
              if not gradle_file.exists():
                  continue

              text = gradle_file.read_text()

              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36",
              )
              text = text.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36",
              )

              gradle_file.write_text(text)
              print(f"Updated {gradle_file}")
              changed = True

          if not changed:
              raise SystemExit(
                  "Could not find the Android app Gradle file."
              )
          PY

          test -d android

      - name: Clean and install dependencies
        working-directory: mobile
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -f pubspec.lock
          rm -rf android/.gradle
          flutter pub get
          flutter pub deps | grep file_picker

      - name: Run Flutter analyzer
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build debug APK
        working-directory: mobile
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photosync-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
