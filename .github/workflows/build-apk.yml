name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "tool/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build PhotoSync Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Show Flutter version
        run: flutter --version

      - name: Check project files
        run: |
          test -f mobile/pubspec.yaml
          test -f tool/configure_android.py
          ls -la mobile
          ls -la tool

      - name: Generate Android platform
        working-directory: mobile
        run: |
          flutter create . --platforms=android
          test -d android

      - name: Configure Android permissions and SDK
        run: |
          python3 tool/configure_android.py
          cat mobile/android/app/src/main/AndroidManifest.xml

      - name: Clean and install dependencies
        working-directory: mobile
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -f pubspec.lock
          rm -rf android/.gradle
          flutter pub get
          flutter pub deps | grep file_picker

      - name: Run Flutter analyzer
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: photosync-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
